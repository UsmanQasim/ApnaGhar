# Local development only. Production uses Neon (Postgres) and Cloudflare R2.
#
# The Redis service was removed on 2026-08-23: OTP codes moved into Postgres, so
# the API no longer needs an always-on service to connect to — which is what let
# it run serverless. BullMQ was a dependency but no queue was ever wired up in
# app.module.ts, so nothing else used it.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ghar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghar
      POSTGRES_PASSWORD: ghar
      POSTGRES_DB: ghar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ghar -d ghar']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local stand-in for Cloudflare R2 (S3-compatible) during development.
    image: minio/minio:latest
    container_name: ghar-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ghar
      MINIO_ROOT_PASSWORD: ghar12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
