<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- Top App Bar -->
<header class="bg-surface text-primary font-headline-md font-bold text-headline-md docked full-width top-0 shadow-sm flex flex-row justify-between items-center w-full px-md h-touch-target relative z-10 border-b border-surface-container-high">
<button class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">بلنگ اور ادائیگی</h1>
<div class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-full transition-colors relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
</div>
</header>
<main class="px-md py-lg max-w-4xl mx-auto space-y-xl pb-32 md:pb-lg">
<!-- Summary Card (Glassmorphism inspired, Tonal Layer 1) -->
<section class="bg-surface-container-lowest rounded-xl border border-surface-variant shadow-sm overflow-hidden">
<div class="bg-primary-container p-lg flex flex-col items-center justify-center text-center space-y-sm relative">
<div class="absolute top-4 left-4 bg-error-container text-on-error-container px-3 py-1 rounded-full font-label-sm flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-sm">schedule</span>
                    زیر التواء
                 </div>
<h2 class="font-body-md text-on-primary-container opacity-90">کل واجب الادا رقم</h2>
<div class="font-number-lg text-4xl text-on-primary-container font-bold flex items-end justify-center gap-1">
<span class="text-xl pb-1">Rs.</span> 150
                 </div>
<p class="font-label-sm text-on-primary-container opacity-80">آخری تاریخ: 15 اکتوبر 2023</p>
</div>
<div class="p-lg space-y-md">
<h3 class="font-headline-sm text-headline-sm text-on-surface font-semibold border-b border-surface-variant pb-xs">تفصیلات</h3>
<ul class="space-y-sm">
<li class="flex justify-between items-center text-on-surface-variant font-body-md">
<span>ماہانہ پلان (بنیادی)</span>
<span class="font-number-md">Rs. 100</span>
</li>
<li class="flex justify-between items-center text-on-surface-variant font-body-md">
<span>اضافی لسٹنگ (1x)</span>
<span class="font-number-md">Rs. 50</span>
</li>
</ul>
</div>
</section>
<!-- Payment Methods -->
<section class="space-y-md">
<h3 class="font-headline-sm text-headline-sm text-on-surface font-semibold">ادائیگی کا طریقہ منتخب کریں</h3>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">
<!-- EasyPaisa Button -->
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="payment_method" type="radio" value="easypaisa"/>
<div class="h-20 bg-surface-container-lowest border-2 border-surface-variant rounded-xl flex items-center justify-center p-sm gap-md transition-all peer-checked:border-primary peer-checked:bg-surface-container-low hover:bg-surface-container-low">
<!-- Placeholder for EasyPaisa Logo -->
<div class="w-12 h-12 bg-surface-variant rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface group-hover:text-primary transition-colors">ایزی پیسہ</span>
</div>
<div class="absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- JazzCash Button -->
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="payment_method" type="radio" value="jazzcash"/>
<div class="h-20 bg-surface-container-lowest border-2 border-surface-variant rounded-xl flex items-center justify-center p-sm gap-md transition-all peer-checked:border-primary peer-checked:bg-surface-container-low hover:bg-surface-container-low">
<!-- Placeholder for JazzCash Logo -->
<div class="w-12 h-12 bg-surface-variant rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface group-hover:text-primary transition-colors">جیز کیش</span>
</div>
<div class="absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
</div>
</section>
<!-- Pay Action -->
<section class="pt-lg">
<button class="w-full h-touch-target bg-primary text-on-primary font-headline-md text-headline-md font-semibold rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm active:scale-[0.98] flex items-center justify-center gap-xs">
<span>ادائیگی کریں</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-on-surface-variant mt-xs opacity-70">ادائیگی محفوظ ہے</p>
</section>
</main>
<!-- Bottom Nav Bar (Mobile Only) - Suppressed due to Transactional nature -->
