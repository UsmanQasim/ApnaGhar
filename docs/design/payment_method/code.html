<!DOCTYPE html>

<html dir="rtl" lang="ur"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Method</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "inverse-surface": "#213145",
                    "on-secondary-fixed": "#111c2d",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#3c475a",
                    "on-surface": "#0b1c30",
                    "background": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "surface": "#f8f9ff",
                    "tertiary": "#825100",
                    "on-primary-container": "#f5fff7",
                    "on-surface-variant": "#3d4a42",
                    "tertiary-fixed-dim": "#ffb95f",
                    "on-secondary": "#ffffff",
                    "surface-tint": "#006c4a",
                    "secondary-fixed": "#d8e3fb",
                    "surface-container-low": "#eff4ff",
                    "surface-bright": "#f8f9ff",
                    "surface-container-highest": "#d3e4fe",
                    "primary": "#006948",
                    "primary-fixed": "#85f8c4",
                    "outline-variant": "#bccac0",
                    "surface-variant": "#d3e4fe",
                    "on-tertiary-fixed": "#2a1700",
                    "inverse-primary": "#68dba9",
                    "on-tertiary-fixed-variant": "#653e00",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-container": "#d5e0f8",
                    "on-primary-fixed-variant": "#005137",
                    "tertiary-container": "#a36700",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#bcc7de",
                    "primary-container": "#00855d",
                    "surface-container": "#e5eeff",
                    "on-primary-fixed": "#002114",
                    "on-secondary-container": "#586377",
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#68dba9",
                    "secondary": "#545f73",
                    "surface-dim": "#cbdbf5",
                    "surface-container-high": "#dce9ff",
                    "tertiary-fixed": "#ffddb8",
                    "on-primary": "#ffffff",
                    "outline": "#6d7a72",
                    "on-background": "#0b1c30"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "xs": "8px",
                    "base": "4px",
                    "sm": "12px",
                    "touch-target": "48px",
                    "xl": "32px",
                    "lg": "24px",
                    "safe": "env(safe-area-inset-bottom, 24px)"
            },
            "fontFamily": {
                    "headline-md": ["Noto Nastaliq Urdu"],
                    "body-md": ["Noto Nastaliq Urdu"],
                    "headline-lg": ["Noto Nastaliq Urdu"],
                    "number-md": ["Plus Jakarta Sans"],
                    "number-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Noto Nastaliq Urdu"],
                    "label-sm": ["Plus Jakarta Sans"],
                    "headline-sm": ["Noto Nastaliq Urdu"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "48px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "32px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "64px", "fontWeight": "700"}],
                    "number-md": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "number-lg": ["20px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "36px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "headline-sm": ["20px", {"lineHeight": "40px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32 font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Transactional Header -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md px-md py-sm flex items-center justify-between">
<button aria-label="Back" class="w-touch-target h-touch-target flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined text-2xl">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary flex-1 text-center truncate">ادائیگی کا طریقہ</h1>
<div class="w-touch-target h-touch-target"></div> <!-- Spacer for centering -->
</header>
<main class="px-md mt-sm space-y-lg max-w-2xl mx-auto">
<!-- Instructions Card -->
<section class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md shadow-sm space-y-lg">
<!-- Step 1 -->
<div class="flex gap-md items-start">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-number-md font-bold shrink-0 mt-xs">
                    1
                </div>
<div class="flex-1 space-y-sm">
<p class="font-body-md text-body-md text-on-surface font-semibold">اس نمبر پر رقم منتقل کریں</p>
<div class="flex items-center justify-between bg-surface-container p-sm rounded-lg border border-outline-variant/50">
<span class="font-number-lg text-number-lg text-primary tracking-widest pl-sm" dir="ltr">0300-1234567</span>
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary hover:bg-surface-container-high rounded-md transition-colors" title="Copy Number">
<span class="material-symbols-outlined">content_copy</span>
</button>
</div>
</div>
</div>
<!-- Step 2 -->
<div class="flex gap-md items-start">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-number-md font-bold shrink-0 mt-xs">
                    2
                </div>
<div class="flex-1 space-y-sm w-full">
<p class="font-body-md text-body-md text-on-surface font-semibold">رسید کا سکرین شاٹ اپ لوڈ کریں</p>
<label class="block w-full border-2 border-dashed border-outline-variant bg-surface rounded-xl p-lg flex flex-col items-center justify-center gap-sm cursor-pointer hover:bg-surface-container-low transition-colors group h-40">
<input accept="image/*" class="hidden" type="file"/>
<span class="material-symbols-outlined text-outline group-hover:text-primary text-4xl transition-colors">upload_file</span>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors text-center">سکرین شاٹ منتخب کریں</span>
</label>
</div>
</div>
<!-- Step 3 -->
<div class="flex gap-md items-start">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-number-md font-bold shrink-0 mt-xs">
                    3
                </div>
<div class="flex-1 space-y-sm w-full">
<p class="font-body-md text-body-md text-on-surface font-semibold">ٹرانزیکشن آئی ڈی درج کریں</p>
<input class="w-full h-touch-target px-md rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-number-md text-on-surface placeholder:text-outline text-left" dir="ltr" placeholder="مثال: TID12345678" type="text"/>
</div>
</div>
</section>
<!-- Optimistic Access Note -->
<section class="bg-secondary-container text-on-secondary-container p-md rounded-xl flex gap-sm items-start">
<span class="material-symbols-outlined shrink-0 mt-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md leading-relaxed">
<strong class="font-semibold">نوٹ:</strong> آپ کی سہولت کے لیے 24 گھنٹے کے لیے فوری رسائی دی جائے گی، جب تک ہماری ٹیم آپ کی ادائیگی کی تصدیق کرتی ہے۔
            </p>
</section>
</main>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-md bg-surface-container/95 backdrop-blur-sm z-50">
<div class="max-w-2xl mx-auto">
<button class="w-full h-touch-target bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-md hover:shadow-lg">
<span>تصدیق کے لیے بھیجیں</span>
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified</span>
</button>
</div>
</div>
</body></html>
