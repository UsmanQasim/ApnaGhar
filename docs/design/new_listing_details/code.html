<!DOCTYPE html>

<html dir="rtl" lang="ur"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>پراپرٹی کی تفصیلات - Agent Listing Wizard</title>

                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#85f8c4",
                    "on-primary-container": "#f5fff7",
                    "error": "#ba1a1a",
                    "surface-variant": "#d3e4fe",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#68dba9",
                    "secondary-fixed-dim": "#bcc7de",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#68dba9",
                    "tertiary-fixed": "#ffddb8",
                    "on-tertiary-fixed": "#2a1700",
                    "surface": "#f8f9ff",
                    "on-error-container": "#93000a",
                    "on-surface-variant": "#3d4a42",
                    "on-primary-fixed": "#002114",
                    "tertiary-fixed-dim": "#ffb95f",
                    "background": "#f8f9ff",
                    "surface-container-high": "#dce9ff",
                    "surface-dim": "#cbdbf5",
                    "secondary": "#545f73",
                    "on-tertiary": "#ffffff",

            },
            "borderRadius": {

                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "lg": "24px",
                    "md": "16px",
                    "sm": "12px",
                    "xs": "8px",
                    "touch-target": "48px",
                    "xl": "32px",
                    "base": "4px"
            },
            "fontFamily": {
                    "body-md": [
                            "Noto Nastaliq Urdu"
                    ],
                    "body-lg": [
                            "Noto Nastaliq Urdu"
                    ],
                    "label-sm": [
                            "Plus Jakarta Sans"
                    ],
                    "number-lg": [

                    ],

                    ],
                    "label-sm": [

                    "number-lg": [
                            "20px",
                            {

                                    "fontWeight": "700"
                            }
                    ],
                    "headline-sm": [

                            {

                                    "fontWeight": "600"
                            }
                    ],
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "48px",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "64px",
                                    "fontWeight": "700"
                            }
                    ],
                    "number-md": [

                            {
                                    "lineHeight": "20px",

        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Header (Transactional, minimal nav) -->
<header class="bg-surface dark:bg-on-background text-primary dark:text-primary-fixed w-full px-md h-20 flex flex-row items-center justify-between shadow-sm z-10 sticky top-0">
<button class="h-touch-target w-touch-target flex items-center justify-center rounded-full hover:bg-surface-container dark:hover:bg-inverse-surface transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md">پراپرٹی کی تفصیلات</h1>
<div class="w-touch-target h-touch-target"></div>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-3xl mx-auto p-md lg:p-xl flex flex-col gap-lg">
<!-- Progress Indicator -->
<div class="w-full flex flex-col gap-xs">
<div class="flex justify-between text-on-surface-variant font-label-sm text-label-sm">
<span>مرحلہ ۲ / ۵</span>
<span>تفصیلات</span>
</div>
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden flex flex-row-reverse">
<div class="h-full bg-primary w-2/5 rounded-full transition-all duration-500"></div>
</div>
</div>
<!-- Form Content (Bento Style layout for selections) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Purpose Selection (Bento Card) -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-sm shadow-sm md:col-span-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface">مقصد</h2>
<div class="grid grid-cols-2 gap-sm">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="purpose" type="radio" value="sale"/>
<div class="flex flex-col items-center justify-center p-md rounded-lg border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-32">
<span class="material-symbols-outlined text-4xl mb-2 icon-fill" data-icon="sell">sell</span>
<span class="font-body-lg text-body-lg font-semibold">برائے فروخت</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="purpose" type="radio" value="rent"/>
<div class="flex flex-col items-center justify-center p-md rounded-lg border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-32">
<span class="material-symbols-outlined text-4xl mb-2" data-icon="key">key</span>
<span class="font-body-lg text-body-lg font-semibold">برائے کرایہ</span>
</div>
</label>
</div>
</section>
<!-- Property Type Selection -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-sm shadow-sm md:col-span-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface">پراپرٹی کی قسم</h2>
<div class="grid grid-cols-3 sm:grid-cols-4 gap-sm">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="property_type" type="radio" value="house"/>
<div class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-24">
<span class="material-symbols-outlined text-3xl mb-1 icon-fill" data-icon="home">home</span>
<span class="font-body-md text-body-md text-center leading-tight">گھر</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="property_type" type="radio" value="flat"/>
<div class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-24">
<span class="material-symbols-outlined text-3xl mb-1" data-icon="apartment">apartment</span>
<span class="font-body-md text-body-md text-center leading-tight">فلیٹ</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="property_type" type="radio" value="plot"/>
<div class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-24">
<span class="material-symbols-outlined text-3xl mb-1" data-icon="landscape">landscape</span>
<span class="font-body-md text-body-md text-center leading-tight">پلاٹ</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="property_type" type="radio" value="commercial"/>
<div class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-24">
<span class="material-symbols-outlined text-3xl mb-1" data-icon="storefront">storefront</span>
<span class="font-body-md text-body-md text-center leading-tight">کمرشل</span>
</div>
</label>
</div>
</section>
<!-- Area & Unit -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-sm shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center justify-between">
                    رقبہ
                    <button aria-label="رقبہ کی تفصیلات سنیں" class="text-secondary hover:bg-surface-variant p-1 rounded-full flex items-center justify-center" type="button">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</h2>
<div class="flex flex-col gap-sm">
<div class="flex flex-row gap-xs">
<label class="relative cursor-pointer flex-1">
<input checked="" class="peer sr-only" name="area_unit" type="radio" value="marla"/>
<div class="flex items-center justify-center py-xs px-sm rounded border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-touch-target">
<span class="font-body-md text-body-md font-semibold">مرلہ</span>
</div>
</label>
<label class="relative cursor-pointer flex-1">
<input class="peer sr-only" name="area_unit" type="radio" value="kanal"/>
<div class="flex items-center justify-center py-xs px-sm rounded border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-touch-target">
<span class="font-body-md text-body-md font-semibold">کنال</span>
</div>
</label>
<label class="relative cursor-pointer flex-1">
<input class="peer sr-only" name="area_unit" type="radio" value="sqft"/>
<div class="flex items-center justify-center py-xs px-sm rounded border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all hover:bg-surface-container-low h-touch-target">
<span class="font-body-md text-body-md font-semibold">مربع فٹ</span>
</div>
</label>
</div>
<div class="relative">
<input class="w-full h-touch-target px-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-number-md text-number-md text-left" dir="ltr" inputmode="numeric" placeholder="رقبہ درج کریں" type="number"/>
</div>
</div>
</section>
<!-- Price -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-sm shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center justify-between">
                    قیمت
                    <button aria-label="قیمت کی تفصیلات سنیں" class="text-secondary hover:bg-surface-variant p-1 rounded-full flex items-center justify-center" type="button">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</h2>
<div class="relative mt-auto">
<input class="w-full h-touch-target px-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-number-md text-number-md text-left pr-12" dir="ltr" inputmode="numeric" placeholder="قیمت (لاکھ یا کروڑ میں)" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant">Rs.</span>
</div>
<p class="text-on-surface-variant text-sm font-body-md mt-1">مثال: 1.5 کروڑ کے لیے 15000000 درج کریں</p>
</section>
</div>
</main>
<!-- Bottom Action Bar (Transactional navigation) -->
<footer class="bg-surface-container-lowest border-t border-outline-variant w-full p-md sticky bottom-0 z-10 flex flex-row justify-between items-center pb-safe">
<button class="h-touch-target px-lg rounded-full border border-secondary text-secondary font-headline-sm text-headline-sm flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
            پیچھے
        </button>
<button class="h-touch-target px-xl rounded-full bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-md" type="button">
            اگلا
            <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</footer>
</body></html>
