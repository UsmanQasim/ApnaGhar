<body class="bg-surface text-on-surface font-body-md pb-24">
<!-- Top App Bar -->
<header class="flex flex-row-reverse justify-between items-center w-full px-md h-touch-target bg-surface text-primary font-headline-md top-0 sticky z-40 border-b border-surface-variant shadow-sm">
<button class="flex items-center justify-center w-touch-target h-touch-target text-on-surface-variant hover:bg-surface-container rounded-full transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">گھر</h1>
<button class="flex items-center justify-center w-touch-target h-touch-target text-on-surface-variant hover:bg-surface-container rounded-full transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined">mic</span>
</button>
</header>
<!-- Search & Filter Bar -->
<div class="px-md py-sm bg-surface sticky top-[48px] z-30">
<div class="flex items-center bg-surface-container rounded-full px-sm py-xs border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant ml-2">search</span>
<input class="flex-grow bg-transparent border-none focus:ring-0 text-body-lg text-on-surface font-body-lg placeholder:text-on-surface-variant" placeholder="تلاش کریں..." type="text" value="ڈی ایچ اے فیز 5، لاہور"/>
<button class="flex items-center justify-center w-10 h-10 text-primary bg-primary-container rounded-full mr-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">tune</span>
</button>
</div>
</div>
<!-- Main Content: Property List -->
<main class="px-md py-sm flex flex-col gap-sm">
<!-- Property Card 1 -->
<article class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden flex flex-col relative">
<!-- Video Thumbnail Area -->
<div class="relative w-full h-48 bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A modern luxury house exterior in DHA Phase 5 Lahore. High definition photograph showing elegant modern architecture with large glass windows, clean lines, and warm exterior lighting. The day is bright and sunny. Captured in a highly professional real estate photography style, emphasizing trust and premium quality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC69h4S6REuoKej8B8ifTQwagh4UHSYRMzonKJX2OQSmhR57w8xu2u5cQXO2VsViCqf8ifvhpFT0_VyIOaQ0FAE2p7crUCpI2RCHrlubz-qbh1UbZUc8RAxHlnFZVrtDtJ3XjhLHMAClfDG6ejaXRkWn36HRTE6rQt3qKQ97SQoM1hzbBjVXJOukjJ2XdBmLsD7OLBNypaVfz5ElUWG9_7d-VRMDTDnzwhUEiyltMwdajC3zTdErB0X"/>

<div class="absolute inset-0 flex items-center justify-center">
<button class="w-12 h-12 bg-primary/80 rounded-full flex items-center justify-center text-on-primary backdrop-blur-sm shadow-md hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Price Badge -->
<div class="absolute top-sm right-sm bg-tertiary text-on-tertiary px-sm py-1 rounded-full font-number-lg flex items-center shadow-sm">
<span class="font-bold">1.5 کروڑ</span>
</div>
</div>
<!-- Details -->
<div class="p-sm flex flex-col gap-xs">
<div class="flex justify-between items-start">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold line-clamp-1">10 مرلہ جدید ڈیزائن گھر</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">favorite_border</span>
</button>
</div>
<div class="flex items-center text-on-surface-variant text-label-sm font-label-sm mb-xs">
<span class="material-symbols-outlined text-sm ml-1">location_on</span>
<span>ڈی ایچ اے فیز 5، لاہور</span>
</div>
<!-- Stats Row -->
<div class="flex items-center gap-md text-on-surface-variant bg-surface-container-low p-2 rounded-lg justify-between px-4">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-lg">bed</span>
<span class="font-number-md text-number-md">4</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-lg">shower</span>
<span class="font-number-md text-number-md">5</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-lg">straighten</span>
<span class="font-number-md text-number-md">10 مرلہ</span>
</div>
</div>
<hr class="border-outline-variant my-xs"/>

<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline-variant">

</div>
<div class="flex flex-col">
<span class="text-sm font-semibold text-on-surface">علی خان</span>
<span class="text-xs text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">verified</span>
                                ویریفائیڈ ایجنٹ
                            </span>
</div>
</div>
<div class="flex gap-2">
<button class="h-10 px-4 bg-surface-container border border-outline text-on-surface rounded-lg font-body-md hover:bg-surface-variant transition-colors flex items-center justify-center">
<span class="material-symbols-outlined ml-1">chat</span>
</button>
<button class="h-10 px-6 bg-primary text-on-primary rounded-lg font-body-md font-semibold hover:bg-primary-fixed-variant transition-colors flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined ml-1">call</span>
                            کال
                        </button>
</div>
</div>
</div>
</article>
</main>
<!-- Floating Action Button (Voice Search) -->
<button class="fixed bottom-24 right-md w-14 h-14 bg-secondary-container text-on-secondary-container rounded-full shadow-[0_8px_16px_rgba(84,95,115,0.2)] flex items-center justify-center z-40 hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-3xl">mic</span>
</button>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-row-reverse justify-around items-center px-md pb-safe h-20 bg-surface-container rounded-t-xl shadow-lg border-t border-surface-variant/50">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-sm py-xs active:scale-90 transition-all hover:bg-surface-variant rounded-xl">
<span class="material-symbols-outlined">home</span>
<span class="font-body-md text-body-md text-xs mt-1">ہوم</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-sm py-xs active:scale-90 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-body-md text-body-md text-xs mt-1 font-semibold">تلاش</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-sm py-xs active:scale-90 transition-all hover:bg-surface-variant rounded-xl">

<button class="flex flex-col items-center justify-center text-on-surface-variant px-sm py-xs active:scale-90 transition-all hover:bg-surface-variant rounded-xl">
<span class="material-symbols-outlined">person</span>
<span class="font-body-md text-body-md text-xs mt-1">پروفائل</span>
</button>
</nav>
</body></html>
