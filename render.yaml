# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — the Ghar API.
#
# Render's dashboard can read this file directly: New → Blueprint → pick the
# repo. Everything below is created for you; only the values marked
# `sync: false` are typed in by hand (they are secrets, so they must not live
# in Git).
#
# The database is NOT defined here on purpose. Render's free Postgres expires
# after 30 days and has no PostGIS; Neon's free tier has PostGIS and does not
# expire. See docs/DEPLOYMENT.md.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── Redis / Key Value ────────────────────────────────────────────────────
  # NOT optional. OtpService's *constructor* does
  #   new Redis(config.getOrThrow('REDIS_URL'))
  # so the whole Nest app fails to boot if this is missing — the API would
  # crash-loop before serving a single request.
  #
  # Free Key Value is in-memory with no persistence, which is exactly right
  # here: the only thing stored is hashed OTP codes on a 5-minute TTL. A
  # restart loses in-flight codes and the user taps "resend". Nothing durable
  # lives in Redis — BullMQ is a dependency in package.json but no queue is
  # wired up in app.module.ts.
  - type: keyvalue
    name: apna-ghar-redis
    plan: free
    region: singapore
    # Empty list = reachable only from services inside this Render workspace.
    # OTP codes should not be exposed to the public internet.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: apna-ghar-api
    runtime: docker
    plan: free
    # Singapore is Render's closest region to Pakistan (~90ms vs ~250ms from Oregon).
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./apps/api/Dockerfile
    # Build context is the repo root — the API imports @ghar/shared and @ghar/i18n.
    dockerContext: .
    healthCheckPath: /health

    envVars:
      # ── Core ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render provides PORT automatically; main.ts already reads it.

      # Set these to the real URLs after the first deploy (Render gives you
      # the API hostname; Vercel gives you the share hostname).
      - key: API_BASE_URL
        sync: false
      - key: SHARE_BASE_URL
        sync: false

      # ── Database (Neon) ─────────────────────────────────────────────────
      # Use Neon's DIRECT connection string, not the -pooler one. This is a
      # long-lived Nest server, so it wants a real persistent connection.
      - key: DATABASE_URL
        sync: false

      # ── Redis ───────────────────────────────────────────────────────────
      # Filled in automatically by Render from the keyvalue service above.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: apna-ghar-redis
          property: connectionString

      # ── Auth ────────────────────────────────────────────────────────────
      # Render generates these once and keeps them stable across deploys.
      # Rotating them logs every user out, so do not regenerate casually.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 60d

      # ── OTP ─────────────────────────────────────────────────────────────
      # DEMO SETTING. OTP_DEV_MODE=true returns the code in the API response
      # instead of sending an SMS. It must be flipped to false, with a real
      # SMS provider configured, before any real agent signs up.
      - key: OTP_DEV_MODE
        value: 'true'
      - key: OTP_DEV_CODE
        value: '123456'
      - key: OTP_TTL_SECONDS
        value: '300'
      - key: OTP_MAX_ATTEMPTS
        value: '5'
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: '60'

      # ── SMS ─────────────────────────────────────────────────────────────
      - key: SMS_PROVIDER
        value: console
      - key: SMS_SENDER_ID
        value: GHAR

      # ── Media (Cloudflare R2) ───────────────────────────────────────────
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: ghar-media
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_SIGNED_URL_TTL_SECONDS
        value: '900'

      # ── Video (Cloudflare Stream — paid, leave blank for the demo) ──────
      - key: CF_STREAM_ACCOUNT_ID
        sync: false
      - key: CF_STREAM_TOKEN
        sync: false
      - key: CF_STREAM_WEBHOOK_SECRET
        sync: false
      - key: VIDEO_MAX_DURATION_SECONDS
        value: '90'
      - key: VIDEO_MAX_BYTES
        value: '104857600'

      # ── Billing (paisa — never floats) ──────────────────────────────────
      - key: PLAN_BASIC_PRICE_PAISA
        value: '10000'
      - key: PLAN_BASIC_INCLUDED_LISTINGS
        value: '3'
      - key: PLAN_PREMIUM_PRICE_PAISA
        value: '100000'
      - key: PLAN_PREMIUM_INCLUDED_LISTINGS
        value: '20'
      - key: EXTRA_LISTING_FEE_PAISA
        value: '5000'
      - key: BILLING_CYCLE_DAYS
        value: '30'
      - key: GRACE_PERIOD_DAYS
        value: '7'
      - key: DORMANT_AFTER_DAYS
        value: '90'
      - key: MANUAL_PAYMENT_PROVISIONAL_HOURS
        value: '24'

      # ── Payments ────────────────────────────────────────────────────────
      - key: PAYMENTS_MANUAL_ENABLED
        value: 'true'
      - key: MANUAL_EASYPAISA_NUMBER
        sync: false
      - key: MANUAL_EASYPAISA_ACCOUNT_TITLE
        sync: false
      - key: MANUAL_JAZZCASH_NUMBER
        sync: false
      - key: MANUAL_JAZZCASH_ACCOUNT_TITLE
        sync: false
      - key: JAZZCASH_ENABLED
        value: 'false'
